<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám phá du lịch và ẩm thực Hà Nội</title>
</head>
<body>
    <header>
        <h1>Chào mừng đến với Hà Nội</h1>
    </header>

    <main>
        <section>
            <h2>3 Địa điểm du lịch nổi tiếng không thể bỏ qua</h2>
            <p>Hà Nội, thủ đô nghìn năm văn hiến, luôn níu chân du khách bởi vẻ đẹp cổ kính và yên bình. Dưới đây là những địa danh tiêu biểu:</p>
            <ul>
                <li>Hồ Hoàn Kiếm</li>
                <li>Lăng Bác</li>
                <li>Văn miếu Quốc Tử Giám</li>
            </ul>
        </section>

        <section>
            <h2>Một số hình ảnh về Hà Nội</h2>
            <figure>
                <img src="anhHHK.png" alt="Hình ảnh phong cảnh Hồ Hoàn Kiếm thơ mộng vào ban ngày">
                <figcaption>Hồ Hoàn Kiếm mộng mơ</figcaption>
            </figure>

            <figure>
                <img src="anhPho.png" alt="Bát phở bò truyền thống Hà Nội nóng hổi có hành lá">
                <figcaption>Phở bò - Ẩm thực đặc trưng ở Hà Nội</figcaption>
            </figure>
        </section>
    </main>
